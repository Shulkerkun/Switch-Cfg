<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Switch Configurator</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
    }

    .wrap {

      margin: 40px auto;

      background: #111827;
      border: 1px solid #334155;

      margin-top: 0;
    }

<body>
  <div class="wrap">
    <div class="card">
      <h1>Switch Configurator</h1>
      <p>Pagina locale caricata correttamente.</p>
    </div>
